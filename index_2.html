<style>
  :root{
    --blue:#0b5394; --blue-deep:#06365f;
    --yellow:#ffc60a; --orange:#ec6425; --green:#7cc47f; --gray:#b9bec6;
    --paper:#fffdf7; --ink:#231f20; --radius:18px;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--blue);color:var(--ink);
    font-family:-apple-system,"SF Pro Rounded",system-ui,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px}
  header{display:flex;align-items:center;gap:14px;padding:18px 0 8px;color:#fff}
  #face{width:130px;flex:none;transition:transform .3s ease}
  #face svg{width:130px;height:auto;display:block}
  #face.happy{transform:scale(1.08) rotate(-4deg)}
  .face-sm svg{width:130px;height:auto;display:block;margin:0 auto 8px}
  footer{text-align:center;padding:4px 0 28px}
  .export{margin-bottom:16px;border:3px solid var(--ink);border-radius:999px;background:var(--yellow);
    padding:10px 18px;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink)}
  footer .stars{width:200px;height:auto;display:inline-block}
  .foot{margin-top:10px;padding-top:8px;border-top:2px dashed var(--ink);font-size:13px;color:#555}
  .star{flex:none;width:36px;height:36px;padding:0;border:0;background:none;cursor:pointer;line-height:0}
  .star svg{width:36px;height:36px;overflow:visible}
  .star path{fill:#fff;stroke:#231f20;stroke-width:4;stroke-linejoin:round;transition:fill .2s}
  .star.on path{fill:var(--yellow)}
  h1{margin:0;font-size:26px;letter-spacing:.3px}
  .sub{opacity:.85;font-size:14px;margin-top:2px}
  #capture{display:block;width:100%;margin:12px 0 10px;padding:14px 16px;
    border:3px solid var(--ink);border-radius:var(--radius);font-size:16px;background:var(--paper);outline:none}
  nav{display:flex;gap:8px;overflow-x:auto;padding:0 0 14px;scrollbar-width:none}
  nav button{flex:none;border:3px solid var(--ink);border-radius:999px;background:var(--paper);
    padding:8px 14px;font-size:14px;cursor:pointer;color:var(--ink)}
  nav button.on{background:var(--yellow)}
  main{background:var(--paper);border:3px solid var(--ink);border-radius:var(--radius);
    padding:16px;min-height:55vh;margin-bottom:24px}
  .card{background:#fff;border:3px solid var(--ink);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  .card.soon{background:#ffe2cf}
  .card.week{background:#fff4c2}
  .title{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:17px}
  .check{flex:none;width:28px;height:28px;border:3px solid var(--ink);border-radius:10px;
    background:#fff;cursor:pointer;font-weight:900;line-height:1}
  .check.on{background:var(--green)}
  .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
  .chip{font-size:12px;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;background:#fff}
  .chip.stale{background:var(--gray)}
  .chip.sugg{background:var(--yellow);cursor:pointer}
  input[type=text],input[type=date],select{border:2px solid var(--ink);border-radius:12px;
    padding:8px 10px;font-size:14px;background:#fff;color:var(--ink)}
  input.na{flex:1;min-width:160px}
  .empty{text-align:center;padding:40px 10px;color:#555}
  .empty svg{width:90px;height:90px;margin-bottom:8px}
  .count{font-size:13px;color:#555;margin:0 0 10px}
  .warn{background:var(--orange);color:#fff;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-weight:700}

  /* Popup for choosing a category after typing an idea */
  #popup{position:fixed;inset:0;background:rgba(6,54,95,.6);display:none;align-items:center;justify-content:center;padding:18px}
  #popup.open{display:flex}
  .sheet{background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:20px;width:100%;max-width:420px}
  .sheet h2{margin:0 0 4px;font-size:20px}
  .sheet .idea{font-size:15px;color:#555;margin:0 0 14px;word-break:break-word}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{aspect-ratio:1/1;border:3px solid var(--ink);border-radius:var(--radius);font-size:16px;font-weight:700;
    cursor:pointer;color:var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px}
  .tile.active{background:var(--yellow)}
  .tile.commission{background:var(--orange);color:#fff}
  .tile.research{background:var(--green)}
  .tile.someday{background:var(--gray)}
  .tile.inbox{background:#fff}
  .tile.suggested{box-shadow:0 0 0 4px var(--blue)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div id="face" aria-hidden="true"></div>
    <div>
      <h1>My Board</h1>
      <div class="sub" id="summary"></div>
    </div>
  </header>

  <input id="capture" type="text" placeholder="Type an idea and press Enter…" autocomplete="off">

  <nav id="nav"></nav>

  <main id="main"></main>

<div id="popup" role="dialog" aria-modal="true">
  <div class="sheet">
    <h2>Where does this go?</h2>
    <p class="idea" id="popupIdea"></p>
    <div class="grid" id="popupGrid"></div>
  </div>
</div>

<script>
const KEY = 'mi-tablero-v1';
const LIMIT = 3;
const SECTIONS = {
  inbox: 'Inbox',
  active: 'Active',
  commission: 'Commissions',
  research: 'Research',
  someday: 'Someday'
};
const DAY = 86400000;

// Cloud character with a small face
const FACE = `<svg viewBox="0 0 660 490" aria-hidden="true"><g transform="translate(0 55)"><path fill="#fff" stroke="#231f20" stroke-width="15" stroke-linejoin="round" stroke-linecap="round" d="M160 282 C120 300 90 330 160 355 C200 368 260 360 315 292 C340 335 420 370 470 340 C505 318 500 290 470 268 C520 268 560 260 575 190 C590 120 570 80 520 85 C490 88 470 110 440 128 C430 80 400 42 355 40 C325 40 318 80 325 110 C280 85 220 80 185 88 C165 105 170 150 210 176 C160 165 110 160 80 185 C50 210 52 250 80 265 C100 275 130 275 160 282 Z"/><ellipse cx="265" cy="225" rx="6" ry="10" fill="#231f20"/><ellipse cx="402" cy="212" rx="6" ry="10" fill="#231f20"/><path d="M307 255 Q325 268 342 247" fill="none" stroke="#231f20" stroke-width="13" stroke-linecap="round"/></g></svg>`;

// Star icon: black outline, fills yellow when the task is complete
const STAR = `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 L61.8 35.8 L93.7 37.8 L69 58.2 L77 89.2 L50 72 L23 89.2 L31 58.2 L6.3 37.8 L38.2 35.8 Z"/></svg>`;

let state = load();
let view = 'today';
let pendingId = null;

function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || {items: []}; }
  catch(e){ return {items: []}; }
}
function save(){
  localStorage.setItem(KEY, JSON.stringify(state));
  render();
}
function uid(){ return Math.random().toString(36).slice(2, 9); }
function find(id){ return state.items.find(i => i.id === id); }
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Simple keyword suggestion. It only highlights a tile; you always choose.
function suggest(text){
  const t = text.toLowerCase();
  if (/cotiz|cliente|factura|entrega|pedido|comisi|empaque|client|deadline/.test(t)) return 'commission';
  if (/investig|archivo|historia|bogot|vallen|foto|pared|mural|sucre|árabe|arabe|research/.test(t)) return 'research';
  return null;
}

function openCount(section){
  return state.items.filter(i => i.section === section && !i.done).length;
}

function addIdea(text){
  const id = uid();
  state.items.push({
    id, title: text.trim(), section: 'inbox', suggest: suggest(text),
    nextAction: '', deadline: '', done: false, touched: Date.now(), history: []
  });
  return id;
}

function move(id, section){
  if (!section) return false;
  const it = find(id);
  if (section === 'active' && it.section !== 'active' && openCount('active') >= LIMIT){
    alert('You already have ' + LIMIT + ' active projects. Pause or finish one first.');
    return false;
  }
  if (it.section !== section) (it.history = it.history || []).push(it.section);
  it.section = section;
  it.suggest = null;
  it.touched = Date.now();
  return true;
}

function toggle(id){
  const it = find(id);
  it.done = !it.done;
  it.touched = Date.now();
  save();
}

// Redo a completed item: mark it open again and file it in a chosen section
function redo(id, section){
  if (!section) return;
  const it = find(id);
  if (section === 'active' && openCount('active') >= LIMIT){
    alert('You already have ' + LIMIT + ' active projects. Pause or finish one first.');
    render();
    return;
  }
  if (it.section !== section) (it.history = it.history || []).push(it.section);
  it.section = section;
  it.done = false;
  it.suggest = null;
  it.touched = Date.now();
  save();
}
function redoFromSelect(id, el){ redo(id, el.value); }

function edit(id, field, value){
  const it = find(id);
  it[field] = value;
  it.touched = Date.now();
  save();
}

function daysLeft(deadline){
  if (!deadline) return null;
  return Math.ceil((new Date(deadline + 'T23:59:00') - Date.now()) / DAY);
}

function daysSince(ts){ return Math.floor((Date.now() - ts) / DAY); }

// Neutral face (dot eyes, small heart mouth) or done face (closed happy eyes, smile)
function face(done){
  const features = done
    ? `<path d="M33 46 Q39 40 45 46" stroke="#231f20" stroke-width="4" fill="none" stroke-linecap="round"/>
       <path d="M55 46 Q61 40 67 46" stroke="#231f20" stroke-width="4" fill="none" stroke-linecap="round"/>
       <path d="M43 60 Q50 67 57 60" stroke="#231f20" stroke-width="4" fill="none" stroke-linecap="round"/>`
    : `<circle cx="38" cy="46" r="4" fill="#231f20"/>
       <circle cx="62" cy="46" r="4" fill="#231f20"/>
       <path d="M50 66 C44 60 40 61 40 64 C40 68 50 72 50 72 C50 72 60 68 60 64 C60 61 56 60 50 66Z" fill="#231f20"/>`;
  return `<circle cx="50" cy="50" r="46" fill="#fff" stroke="#231f20" stroke-width="3"/>${features}`;
}

function isAllDone(){
  const anyDone = state.items.some(i => i.done);
  const openActive = state.items.filter(i => i.section === 'active' && !i.done).length;
  return anyDone && openActive === 0;
}

function card(it){
  const d = daysLeft(it.deadline);
  const tone = d === null ? '' : d <= 2 ? 'soon' : d <= 7 ? 'week' : '';
  const stale = it.section === 'active' && !it.done && daysSince(it.touched) >= 5;

  let body = '';
  if (it.section === 'inbox'){
    body = `<div class="meta">
      <select onchange="moveFromSelect('${it.id}', this)">
        <option value="">Move to…</option>
        ${Object.keys(SECTIONS).filter(k => k !== 'inbox')
          .map(k => `<option value="${k}">${SECTIONS[k]}</option>`).join('')}
      </select></div>`;
  } else {
    body = `<div class="meta">
      <input type="text" class="na" placeholder="Next action (one small step)" value="${esc(it.nextAction)}"
        onchange="edit('${it.id}','nextAction',this.value)">
      <input type="date" value="${it.deadline}" onchange="edit('${it.id}','deadline',this.value)">
      ${d !== null ? `<span class="chip">${d < 0 ? 'overdue' : d === 0 ? 'today' : 'in ' + d + ' days'}</span>` : ''}
      ${stale ? `<span class="chip stale">${daysSince(it.touched)} days untouched</span>` : ''}
      <select onchange="moveFromSelect('${it.id}', this)">
        <option value="">Move to…</option>
        ${['active','commission','research','someday']
          .filter(k => k !== it.section)
          .map(k => `<option value="${k}">${SECTIONS[k]}</option>`).join('')}
      </select></div>`;
  }

  return `<div class="card ${tone}">
    <div class="title">
      <button class="star ${it.done ? 'on' : ''}" onclick="toggle('${it.id}')" aria-label="Complete">${STAR}</button>
      <span>${esc(it.title)}</span>
    </div>
    ${body}
  </div>`;
}

function moveFromSelect(id, el){
  if (move(id, el.value)) save(); else render();
}

function emptyState(text){
  return `<div class="empty"><div class="face-sm">${FACE}</div><div>${text}</div></div>`;
}

function viewToday(){
  const active = state.items.filter(i => i.section === 'active' && !i.done);
  if (!active.length){
    return emptyState('Nothing active right now. Pick up to ' + LIMIT + ' projects from Inbox or Commissions.');
  }
  return `<p class="count">Your next steps</p>` + active.map(it => `
    <div class="card">
      <div class="title"><button class="star" onclick="toggle('${it.id}')" aria-label="Complete">${STAR}</button>
      <span>${esc(it.nextAction || it.title)}</span></div>
      <div class="meta"><span class="chip">${esc(it.title)}</span></div>
    </div>`).join('');
}

// Archive: every completed item, with its category history in the footer
function viewArchive(){
  const items = state.items.filter(i => i.done).sort((a, b) => b.touched - a.touched);
  if (!items.length) return emptyState('Nothing completed yet. Finished tasks appear here.');
  return items.map(it => {
    const path = [...(it.history || []), it.section].map(k => SECTIONS[k]).join(' → ');
    return `<div class="card">
      <div class="title">
        <button class="star on" onclick="toggle('${it.id}')" aria-label="Redo">${STAR}</button>
        <span>${esc(it.title)}</span>
      </div>
      <div class="meta">
        <select onchange="redoFromSelect('${it.id}', this)">
          <option value="">Redo as…</option>
          ${Object.keys(SECTIONS).map(k => `<option value="${k}">${SECTIONS[k]}</option>`).join('')}
        </select>
      </div>
      <div class="foot">Category history: ${esc(path)}</div>
    </div>`;
  }).join('');
}

function viewSection(section){
  const items = state.items.filter(i => i.section === section && !i.done);
  if (!items.length){
    const text = section === 'inbox'
      ? 'Inbox is empty. Type an idea above when it shows up.'
      : 'Nothing here yet.';
    return emptyState(text);
  }
  const warn = section === 'active' && items.length >= LIMIT
    ? `<div class="warn">${LIMIT} of ${LIMIT} active projects in use.</div>` : '';
  return warn + items.map(card).join('');
}

function render(){
  const done = state.items.filter(i => i.done).length;
  const faceEl = document.getElementById('face');
  faceEl.innerHTML = FACE;
  faceEl.classList.toggle('happy', isAllDone());
  document.getElementById('summary').textContent =
    'Active: ' + openCount('active') + '/' + LIMIT + ' · Done: ' + done;

  const tabs = [['today','Today']].concat(Object.entries(SECTIONS), [['archive','Archive (' + done + ')']]);
  document.getElementById('nav').innerHTML = tabs.map(([k, label]) =>
    `<button class="${view === k ? 'on' : ''}" onclick="setView('${k}')">${label}${
      k === 'inbox' ? ' (' + openCount('inbox') + ')' : ''}</button>`).join('');

  document.getElementById('main').innerHTML =
    view === 'today' ? viewToday() : view === 'archive' ? viewArchive() : viewSection(view);
}

function setView(v){ view = v; render(); }

// Download the whole board as a JSON backup file
function exportBoard(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'my-board-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

// Popup with square category tiles
function openPopup(id){
  pendingId = id;
  const it = find(id);
  document.getElementById('popupIdea').textContent = it.title;
  const order = ['active','commission','research','someday','inbox'];
  document.getElementById('popupGrid').innerHTML = order.map(k => `
    <button class="tile ${k} ${it.suggest === k ? 'suggested' : ''}" onclick="chooseTile('${k}')">
      ${SECTIONS[k]}</button>`).join('');
  document.getElementById('popup').classList.add('open');
}

function closePopup(){
  document.getElementById('popup').classList.remove('open');
  pendingId = null;
  render();
}

function chooseTile(section){
  if (section !== 'inbox' && !move(pendingId, section)) return;
  closePopup();
  view = section === 'inbox' ? 'inbox' : section;
  save();
}

document.getElementById('capture').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value.trim()){
    const id = addIdea(e.target.value);
    e.target.value = '';
    save();
    openPopup(id);
  }
});

document.getElementById('popup').addEventListener('click', e => {
  if (e.target.id === 'popup') closePopup();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('popup').classList.contains('open')) closePopup();
});

render();
</script>
</body>
</html>
